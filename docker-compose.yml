services:
  bot-office:
    image: nginx:1.27-alpine
    container_name: bot-office
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BOT_OFFICE_PORT:-8095}:80"   # loopback only; exposed via tailscale serve
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
