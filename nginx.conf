server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # config.js / app.js change often while you edit the crew — never cache them
  location ~* \.(html|js|css)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /vendor/ { add_header Cache-Control "public, max-age=604800"; }
  location /fonts/  { add_header Cache-Control "public, max-age=604800"; }
  gzip on; gzip_types application/javascript text/css;
}
