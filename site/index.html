<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grok Bot · AI Office</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2728%27 fill=%27%233d7bff%27/%3E%3C/svg%3E">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body class="night">
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="labels"></div>

  <header id="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4c16 0 28 11 28 27 0 17-12 29-28 29S4 48 4 31C4 15 16 4 32 4z" fill="#3d7bff"/><rect x="21" y="20" width="6" height="14" rx="3" fill="#0b0b0f" transform="rotate(-12 24 27)"/><rect x="36" y="20" width="6" height="14" rx="3" fill="#0b0b0f" transform="rotate(-12 39 27)"/></svg>
      <span class="wordmark" id="brand"></span>
    </div>
    <div class="titleblock">
      <div class="title" id="title"></div>
      <div class="subtitle"><i class="rec"></i><span id="subtitle"></span></div>
    </div>
  </header>
  <div id="chips"></div>
  <div id="clock"><div class="t" id="tclock">T+ 00:00:00</div><div class="lbl">MISSION CLOCK</div></div>

  <footer id="legend"></footer>
  <div id="tod">
    <button data-tod="now">NOW</button><button data-tod="day">DAY</button><button data-tod="dusk">DUSK</button><button data-tod="night" class="on">NIGHT</button>
  </div>
</div>

<aside id="side">
  <section class="card" id="crewcard">
    <div class="cardhead"><h2>CREW</h2><span id="crewcount"></span></div>
    <ul id="crew"></ul>
  </section>
  <section class="card" id="focus">
    <div class="fhead"><div class="av" id="fav"></div><div><div class="fname" id="fname"></div><div class="fsub" id="fsub"></div></div><span class="pill" id="fpill"></span></div>
    <div class="flabel">TASK</div>
    <div class="ftitle" id="ftitle"></div>
    <canvas id="fgauge" width="270" height="104" aria-label="Task progress gauge"></canvas>
    <div class="prog"><div class="bar"><i id="fbar"></i></div><span id="fstep"></span></div>
    <ul id="flog"></ul>
    <div class="gonogo"><button id="go">GO</button><button id="nogo">NO-GO</button></div>
    <div class="hint">Your bot gets the answer the next time it checks in.</div>
  </section>
  <section class="card" id="actcard">
    <div class="cardhead"><h2>ACTIVITY</h2><span>NEWEST FIRST</span></div>
    <ul id="activity"></ul>
  </section>
</aside>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
